name: Notebook CI

on:
  pull_request:
  push:
    branches:
      - master
      - "maintenance/**"

permissions:
  contents: read

jobs:
  notebooks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      - name: Validate all notebooks
        run: uv run --locked --all-groups python scripts/validate_notebooks.py

      - name: Execute compatible smoke notebooks
        run: uv run --locked --all-groups python scripts/execute_notebooks.py
